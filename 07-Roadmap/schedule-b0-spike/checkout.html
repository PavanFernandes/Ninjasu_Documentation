<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>B0 spike checkout (TEST MODE)</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 560px; margin: 32px auto; padding: 0 16px; }
  label { display: block; margin-top: 12px; font-weight: 600; }
  input { width: 100%; padding: 8px; box-sizing: border-box; }
  button { margin-top: 16px; padding: 10px 16px; }
  pre { background: #f3f3f3; padding: 12px; white-space: pre-wrap; word-break: break-all; }
</style>
</head>
<body>
<h2>B0 spike checkout (TEST keys only)</h2>
<p>Paste the public <b>key_id</b> (rzp_test_...) and an <b>order id</b> from Postman. In the checkout choose UPI and enter
<code>success@razorpay</code> (success path) or <code>failure@razorpay</code> (failure path). Never paste the secret here.</p>
<label>key_id <input id="key" placeholder="rzp_test_xxxxxxxx"></label>
<label>order_id <input id="order" placeholder="order_xxxxxxxx"></label>
<button id="pay">Open checkout</button>
<pre id="out"></pre>
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<script>
  const out = document.getElementById('out');
  document.getElementById('pay').onclick = () => {
    const key = document.getElementById('key').value.trim();
    const order = document.getElementById('order').value.trim();
    if (!key.startsWith('rzp_test_')) { out.textContent = 'Refusing: key_id must start with rzp_test_'; return; }
    const rzp = new Razorpay({
      key, order_id: order, amount: 100, currency: 'INR', name: 'B0 spike',
      handler: r => { out.textContent = 'AUTHORISED/PAID callback:\n' + JSON.stringify(r, null, 2); }
    });
    rzp.on('payment.failed', r => { out.textContent = 'FAILED callback:\n' + JSON.stringify(r.error, null, 2); });
    rzp.open();
  };
</script>
</body>
</html>
